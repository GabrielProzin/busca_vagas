# Preferências da busca. Tudo que muda o que entra (ou não) na lista diária fica aqui.

# Termos usados para buscar vagas nas fontes. Cada termo vira uma busca separada.
termos_busca:
  - analista de dados
  - analista de bi
  - business intelligence
  - engenheiro de dados
  - engenharia de dados
  - analytics engineer
  - cientista de dados
  - ciência de dados
  - data analyst
  - data engineer
  - power bi

# Trilhas de cargo, na ordem de prioridade. O título da vaga é classificado
# na primeira trilha cujo padrão (regex, sem acento, minúsculo) bater.
trilhas:
  - nome: Analista de Dados / BI
    peso: 1.0
    padroes: ['analista de (dados|bi|business intelligence|inteligencia)', 'data analyst', '\bbi\b', 'business intelligence', 'power ?bi', 'analytics(?! engineer)']
  - nome: Engenharia de Dados
    peso: 0.95
    padroes: ['engenheir[oa] de dados', 'engenharia de dados', 'data engineer', 'analytics engineer', '\betl\b']
  - nome: Ciência de Dados
    peso: 0.85
    padroes: ['cientista de dados', 'ciencia de dados', 'data scien', 'machine learning', '\bml\b']
  - nome: Dados (genérico)
    peso: 0.7
    padroes: ['\bdados\b', '\bdata\b']

# Senioridade. Vagas com estes termos no TÍTULO são descartadas.
senioridade_bloqueada: ['senior', 'sênior', '\bsr\.?\b', 'pleno', '\bpl\b', 'especialista', 'lead', 'lider', 'líder', 'coordenador', 'gerente', 'head', 'principal', 'staff', 'estagi', 'trainee', 'aprendiz', '\biii\b', '\bii\b']
# Termos que marcam a vaga como júnior (sobem a nota).
senioridade_alvo: ['junior', 'júnior', '\bjr\.?\b', '\bi\b', 'assistente', 'entry']
# Descarta a vaga se a descrição pedir mais que isso de experiência.
max_anos_experiencia: 2

# Palavras que eliminam a vaga se aparecerem no título.
bloqueio_titulo: ['\.net', '\bjava\b', 'desenvolvedor', 'developer', 'programador', 'front[- ]?end', 'back[- ]?end', 'full[- ]?stack', 'mobile', '\bqa\b', 'suporte', 'help ?desk']

# Empresas (nome ou domínio) para nunca enviar.
empresas_bloqueadas: []

# Localização. Remoto vale para o Brasil todo; híbrido/presencial só nestas cidades.
localizacao:
  aceita_remoto: true
  cidades_presencial_hibrido: ['goiania', 'aparecida de goiania', 'senador canedo', 'trindade']
  estado: GO

# Ferramentas que, se forem requisito central e você não tiver, mandam a vaga
# para a lista "vale tentar" em vez da lista principal.
requisitos_ausentes_pesados: ['spark', 'databricks', 'aws', 'azure', 'scala', 'kafka', 'snowflake', '\bsas\b', 'rstudio', 'linguagem r\b']

# Corte de nota (0-100). Abaixo disso a vaga não aparece.
nota_minima: 45
# Só considera vagas publicadas nos últimos N dias.
max_dias_publicacao: 14
