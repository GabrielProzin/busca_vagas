# Preferências da busca. Tudo que muda o que entra (ou não) na lista diária fica aqui.

# Termos usados para buscar vagas nas fontes. Cada termo vira uma busca separada.
termos_busca:
  - analista de dados
  - analista de bi
  - business intelligence
  - engenheiro de dados
  - engenharia de dados
  - analytics engineer
  - cientista de dados
  - ciência de dados
  - data analyst
  - data engineer
  - power bi

# Sólides: a busca por título casa qualquer palavra, então usamos termos curtos e específicos.
termos_solides: [dados, bi, data, analytics]

# Trilhas de cargo, na ordem de prioridade. O título da vaga é classificado
# na primeira trilha cujo padrão (regex, sem acento, minúsculo) bater.
trilhas:
  - nome: Analista de Dados / BI
    peso: 1.0
    padroes: ['analista de (dados|bi|business intelligence|inteligencia)', 'data analyst', '\bbi\b', 'business intelligence', 'power ?bi', 'analytics(?! engineer)']
  - nome: Engenharia de Dados
    peso: 0.95
    padroes: ['engenheir[oa] de dados', 'engenharia de dados', 'data engineer', 'analytics engineer', '\betl\b']
  - nome: Ciência de Dados
    peso: 0.85
    padroes: ['cientista de dados', 'ciencia de dados', 'data scien', 'machine learning', '\bml\b']
  - nome: Dados (genérico)
    peso: 0.7
    padroes: ['\bdados\b', '\bdata\b']

# Senioridade. Vagas com estes termos no TÍTULO são descartadas.
senioridade_bloqueada: ['senior', 'sênior', '\bsr\.?\b', 'pleno', '\bpl\b', 'especialista', 'specialist', 'expert', 'mid[- ]?level', 'lead', 'lider', 'líder', 'coordenador', 'gerente', 'manager', 'head', 'principal', 'staff', 'arquitet', 'architect', 'estagi', 'intern\b', 'trainee', 'aprendiz', '\biii\b', '\bii\b']
# Vaga sem nível no título: descarta se a descrição falar em pleno/sênior
# pelo menos este número de vezes e nunca em júnior.
min_mencoes_senioridade_descricao: 2
# Termos que marcam a vaga como júnior (sobem a nota).
senioridade_alvo: ['junior', 'júnior', '\bjr\.?\b', '\bi\b', 'assistente', 'entry']
# Descarta a vaga se a descrição pedir mais que isso de experiência.
max_anos_experiencia: 2

# Palavras que eliminam a vaga se aparecerem no título.
bloqueio_titulo: ['\.net', '\bjava\b', 'security', 'seguranca','desenvolvedor', 'developer', 'programador', 'front[- ]?end', 'back[- ]?end', 'full[- ]?stack', 'mobile', '\bqa\b', 'suporte', 'help ?desk']

# Empresas (nome ou domínio) para nunca enviar.
empresas_bloqueadas: []

# Localização. Remoto vale para o Brasil todo; híbrido/presencial só nestas cidades.
localizacao:
  aceita_remoto: true
  cidades_presencial_hibrido: ['goiania', 'aparecida de goiania', 'senador canedo', 'trindade']
  estado: GO
  # Vagas com descrição em inglês (quase sempre empresa estrangeira pedindo inglês fluente).
  aceita_vagas_em_ingles: false
  # Posts do LinkedIn muitas vezes não dizem o local. Ficam na lista com um aviso, em vez de sumir.
  local_nao_informado_aceito_em: [linkedin]

# Posts de vaga do LinkedIn com email do recrutador (via Apify, sem usar a sua conta).
# Precisa do secret APIFY_TOKEN. Custo ~US$ 2 por 1.000 posts, pago com o crédito grátis de US$ 5/mês:
# 2 buscas x 20 posts x 2 coletas por dia = ~2.400 posts/mês. Mude com cuidado.
linkedin_posts:
  horas: 13                 # cada coleta olha só as últimas 13 horas (as duas coletas do dia não se repetem)
  max_posts_por_busca: 20
  buscas:
    # Máximo de 5 operadores (AND/OR) por busca, limite do ator.
    - 'vaga AND (currículo OR curriculo) AND ("analista de dados" OR "analista de BI")'
    - 'vaga AND (currículo OR curriculo) AND ("cientista de dados" OR "engenheiro de dados")'

# Ferramentas que, se forem requisito central e você não tiver, mandam a vaga
# para a lista "vale tentar" em vez da lista principal.
requisitos_ausentes_pesados: ['spark', 'databricks', 'aws', 'azure', 'scala', 'kafka', 'snowflake', '\bsas\b', 'rstudio', 'linguagem r\b']

# Corte de nota (0-100). Abaixo disso a vaga não aparece.
nota_minima: 50
# Email de resumo depois de cada coleta: só vagas NOVAS com nota a partir deste valor.
resumo:
  nota_minima: 85
# Só considera vagas publicadas nos últimos N dias.
max_dias_publicacao: 14
