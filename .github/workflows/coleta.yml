name: Coleta de vagas

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3). O GitHub costuma atrasar alguns minutos os agendamentos,
    # então eles estão marcados um pouco antes.
    # Completas (todas as fontes, LinkedIn e email de resumo): ~11:00 e ~18:30.
    - cron: "52 13 * * *"   # ~11:00 em Brasília
    - cron: "22 21 * * *"   # ~18:30 em Brasília
    # Rápidas (só as plataformas, sem LinkedIn e sem email): ~8:00, ~14:00 e ~22:00.
    - cron: "52 10 * * *"   # ~8:00
    - cron: "52 16 * * *"   # ~14:00
    - cron: "52 0 * * *"    # ~22:00
  workflow_dispatch:
    inputs:
      tipo:
        description: "completa (com LinkedIn e resumo) ou rapida (só as plataformas)"
        type: choice
        options: [completa, rapida]
        default: completa
      resumo_detalhado:
        description: "Mostrar a tabela de vagas no resumo (o repo é público)"
        type: boolean
        default: false
      resumo_teste:
        description: "Mandar o email de resumo mesmo sem vaga nova (para ver o formato)"
        type: boolean
        default: false
      sondar_linkedin:
        description: "Testar variações da busca de posts do LinkedIn (custo mínimo)"
        type: boolean
        default: false
      diagnostico:
        description: "Publicar log e resultado no branch 'diagnostico' (para depurar)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # para somar os minutos de Actions do mês (página Uso dos serviços)

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache do modelo de embeddings
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-paraphrase-multilingual-minilm-v1

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Sondar busca de posts do LinkedIn
        if: ${{ inputs.sondar_linkedin }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/sondar_linkedin.py

      - name: Coletar, filtrar e ranquear
        if: ${{ !inputs.sondar_linkedin }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RESUMO_DETALHADO: ${{ inputs.resumo_detalhado && '1' || '0' }}
          RESUMO_TESTE: ${{ inputs.resumo_teste && '1' || '0' }}
          # Agendamentos que não são os das 11:00 e 18:30 são coletas rápidas.
          COLETA_TIPO: ${{ github.event_name == 'schedule' && github.event.schedule != '52 13 * * *' && github.event.schedule != '22 21 * * *' && 'rapida' || inputs.tipo || 'completa' }}
          CONTATO_TELEFONE: ${{ secrets.CONTATO_TELEFONE }}
          FOLLOWUP_SEMPRE: ${{ inputs.resumo_teste && '1' || '0' }}
          # Email de resumo (vagas novas com nota 85+)
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RESUMO_PARA: ${{ secrets.RESUMO_PARA }}
        shell: bash   # com "shell: bash" o Actions usa pipefail, então o tee não esconde falhas
        run: python -m coletor.pipeline 2>&1 | tee saida_log.txt

      - name: Ler respostas e devoluções no Gmail
        if: ${{ !inputs.sondar_linkedin }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m coletor.envio --so-respostas

      - name: Medir o uso dos serviços grátis
        if: ${{ !inputs.sondar_linkedin }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESUMO_PARA: ${{ secrets.RESUMO_PARA }}
        run: python -m coletor.uso

      - name: Avisar por email se algo falhou
        if: ${{ failure() }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESUMO_PARA: ${{ secrets.RESUMO_PARA }}
        run: python -m coletor.alerta "O workflow de coleta falhou" "Um passo do workflow terminou com erro. Abra o link para ver qual."

      - name: Sondar fontes
        if: ${{ always() && inputs.diagnostico }}
        run: mkdir -p saida && python scripts/sondar_fontes.py > saida/sondagem.txt 2>&1 || true

      - name: Publicar diagnóstico
        if: ${{ always() && inputs.diagnostico }}
        run: |
          # Só logs e contagens: os arquivos de vagas (com emails de recrutadores) não vão para o branch público.
          mkdir -p /tmp/diag && cp saida/sondagem*.txt /tmp/diag/ 2>/dev/null || true
          cp saida_log.txt /tmp/diag/log.txt 2>/dev/null || true
          # A Vercel tenta publicar todo branch como preview. Este branch só tem logs, então
          # desliga o deploy dele (a Vercel lê o vercel.json dentro da pasta "site").
          mkdir -p /tmp/diag/site && echo '{"git":{"deploymentEnabled":false}}' > /tmp/diag/site/vercel.json
          cd /tmp/diag
          git init -q && git checkout -q -b diagnostico
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "diagnóstico ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" diagnostico

      # Backup cifrado (o repositório é público: sem a BACKUP_SENHA o arquivo não abre).
      # Roda mesmo se a coleta falhar, e confere o arquivo contra o banco antes de guardar.
      - name: Backup cifrado e teste de restauração
        if: ${{ always() && !inputs.sondar_linkedin }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          python -m coletor.backup gerar saida_backup/busca_vagas.bvbk
          if [ -f saida_backup/busca_vagas.bvbk ]; then python -m coletor.backup verificar saida_backup/busca_vagas.bvbk; fi

      - name: Guardar backup (14 dias)
        if: ${{ always() && hashFiles('saida_backup/busca_vagas.bvbk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backup-cifrado
          path: saida_backup/busca_vagas.bvbk
          retention-days: 14
